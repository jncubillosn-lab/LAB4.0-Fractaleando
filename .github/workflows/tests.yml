name: P1 - pruebas de regresión
on:
  push:
    branches: [main, refactor/p1-modular-estable]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobaciones sin dependencias externas
        run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Chromium para pruebas E2E
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Probar la página modular real y el worker
        run: |
          python tests/pages_e2e.py
          python tests/views_e2e.py
          python tests/topology_guard_e2e.py

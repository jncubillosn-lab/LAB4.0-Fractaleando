name: P1 - pruebas de regresión
on:
  push:
    branches: [main, refactor/p1-modular-estable]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobaciones sin dependencias externas
        run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Chromium para pruebas E2E
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Probar la página modular real y el worker
        run: |
          python tests/pages_e2e.py
          python tests/views_e2e.py
          python tests/topology_guard_e2e.py

  deploy-pages:
    name: Publicar P1 en GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar la versión aprobada
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar únicamente los archivos del sitio estático
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R css js _site/
          test -f _site/index.html
          test -f _site/js/geometry/ViewLayouts.js
          test -f _site/js/views/DerivedViews.js
          grep -q 'data-view="04"' _site/index.html
          grep -q 'id="themeBtn"' _site/index.html
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Desplegar Pages
        id: deployment
        uses: actions/deploy-pages@v4

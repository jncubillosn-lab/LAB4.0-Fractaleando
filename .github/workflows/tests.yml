name: Fractalear - pruebas y publicación
on:
  push:
    branches: [main, refactor/p1-modular-estable]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Comprobar grafo, geometría y motor
        run: npm test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright y verificar Chrome preinstalado
        run: |
          python -m pip install 'playwright==1.56.0'
          command -v google-chrome
          google-chrome --version
      - name: Probar la página modular real y el worker
        env:
          P1_SITE_ROOT: _site
          P1_SCREENSHOTS: artifacts/views
        run: |
          result=0
          python tests/pages_e2e.py || result=$?
          python tests/views_e2e.py || result=$?
          python tests/topology_guard_e2e.py || result=$?
          python tests/integrity_e2e.py || result=$?
          exit "$result"

      - name: Conservar evidencia de las vistas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fractalear-vistas-1.2.2
          path: artifacts/views/
          if-no-files-found: ignore

  deploy-pages:
    name: Publicar Fractalear en GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar la versión aprobada
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar únicamente los archivos del sitio estático
        run: |
          npm run build
          test -f _site/index.html
          test -f _site/js/geometry/ViewLayouts.js
          test -f _site/js/views/DerivedViews.js
          test -f _site/js/vendor/libavoid.wasm
          grep -q 'data-view="04"' _site/index.html
          grep -q 'id="themeBtn"' _site/index.html
      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Desplegar Pages
        id: deployment
        uses: actions/deploy-pages@v4

  tag-release:
    name: Fijar etiqueta de versión publicada
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Crear la etiqueta solo si todavía no existe
        run: |
          tag="v$(node -p "require('./package.json').version")"
          git check-ref-format "refs/tags/$tag"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "La etiqueta $tag ya existe; se conserva intacta."
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
